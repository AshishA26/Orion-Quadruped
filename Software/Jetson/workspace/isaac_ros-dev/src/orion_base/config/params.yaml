# orion_base/config/params.yaml

# PS5 controller driver
joy_node:
  ros__parameters:
    device_id: 0            # /dev/input/js0
    deadzone: 0.05          # Ignore small stick drifts
    autorepeat_rate: 50.0   # Force 50 msgs/sec even if holding still (matches STM32 Hz)

# Joystick command parser
joystick_parser_node:
  ros__parameters:
    max_speed: 1.0           # Max speed in m/s or rad/s
    max_roll: 0.349          # ~20 degrees in radians
    max_pitch: 0.436         # ~25 degrees in radians
    max_yaw: 0.524           # ~30 degrees in radians
    max_z_offset: 60.0       # Maximum translation up/down in mm
    boost: 0.5               # Extra speed when R2 held
    tilt_step: 0.01          # Step size per tick for roll/pitch/yaw
    z_offset_step: 1.0       # Step size per tick for z position
    xy_offset_multiplier: 40 # Multiplier for xy position control
    pivot_step: 1.0          # Step size for pivot point in mm

# STM32 UART bridge
stm32_bridge_node:
  ros__parameters:
    serial_port: '/dev/ttyTHS1'
    baud_rate: 460800
    send_rate_hz: 50.0      # Timer frequency for UART writes

# Command Mux
cmd_mux_node:
  ros__parameters:
    send_rate_hz: 50.0
    max_motion_speed: 1.5
    strafe_gaze_weight: 0.8
    # Asymmetric eye scaling (curiosity on motion)
    curious_scale_enabled: false
    curious_scale_max: 1.3
    strafe_scale_weight: 0.8
    max_yaw: 0.524

# Roboeyes
roboeyes_node:
  ros__parameters:
    width: 1920
    height: 1080
    fullscreen: true
    fps: 60
    eye_color_r: 0
    eye_color_g: 190
    eye_color_b: 255
    # Animation tuning
    blink_duration: 0.2
    auto_blink: true
    auto_idle: true
    blink_interval_min: 1.0
    blink_interval_max: 4.0
    idle_interval_min: 0.5
    idle_interval_max: 2.5
    gaze_smoothing: 0.15
    # Gaze movement boundaries (how close to the screen edge eyes can look)
    max_gaze_x_bound: 0.2
    max_gaze_y_bound: 0.25