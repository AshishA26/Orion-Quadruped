# orion_camera/config/params.yaml

gstreamer_dual_camera_node:
  ros__parameters:
    # IMX219-83 dual CSI camera settings
    capture_width: 1280
    capture_height: 720
    framerate: 60
    flip_method: 0  # 0=none, 2=rotate-180

    # Calibration file paths (relative to orion_camera share directory)
    left_camera_info_path: ""
    right_camera_info_path: ""

    # TF frame IDs
    left_frame_id: "left_camera"
    right_frame_id: "right_camera"